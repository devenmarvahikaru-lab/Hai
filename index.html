<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Bucin - Full Romantis</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            /* Background gradasi merah gelap ke hitam biar lebih elegan */
            background: radial-gradient(circle at center, #240000 0%, #000000 70%, #000000 100%);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial Black', Arial, sans-serif;
            color: white;
        }
        canvas {
            display: block;
        }
        /* Tombol / Teks untuk memulai musik (karena browser block autoplay tanpa interaksi) */
        #startBtn {
            position: absolute;
            z-index: 10;
            background: rgba(255, 0, 50, 0.2);
            border: 2px solid #ff1a1a;
            color: #ff1a1a;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            backdrop-filter: blur(5px);
            transition: 0.3s;
        }
        #startBtn:hover {
            background: rgba(255, 0, 50, 0.5);
            color: white;
        }
    </style>
</head>
<body>
    <!-- SIAPIN LAGU: Taruh file lagu kamu di folder yang sama, lalu ganti 'lagu-bucin.mp3' di bawah ini -->
    <audio id="bgMusic" loop>
        <source src="love w2h.mp3" type="audio/mpeg">
    </audio>

    <button id="startBtn">Klik Untuk Memulai 💌</button>
    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const bgMusic = document.getElementById('bgMusic');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const textToDisplay = "I Love You"; 
        const centerText = "01001110Y"; // Ganti pakai nama target lu!
        
        let particles = [];
        let roses = [];
        let stars = [];

        // Fungsi Matematika Hati
        function heartPosition(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            return { x, y };
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < 150; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.5,
                    alpha: Math.random(),
                    fadeSpeed: (Math.random() * 0.02) + 0.005
                });
            }
        }

        function initHeart() {
            particles = [];
            const tracks = [
                { count: 40, scaleOffset: 0.9, speed: 0.015 }, 
                { count: 45, scaleOffset: 1.0, speed: 0.015 }, 
                { count: 50, scaleOffset: 1.1, speed: 0.015 }  
            ];
            
            tracks.forEach(track => {
                for(let i = 0; i < track.count; i++) {
                    const t = (Math.PI * 2 * i) / track.count;
                    particles.push({ t: t, speed: track.speed, trackScale: track.scaleOffset });
                }
            });
        }

        function initRoses() {
            roses = [];
            const roseCount = 20; 
            for(let i = 0; i < roseCount; i++) {
                roses.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height, 
                    size: Math.random() * 12 + 14, 
                    speedY: Math.random() * 2 + 1.5, 
                    speedX: Math.random() * 0.6 - 0.3, 
                    angle: Math.random() * 360, 
                    spin: Math.random() * 0.03 - 0.015 
                });
            }
        }

        function animate() {
            // Clear canvas dengan transparent biar keliatan CSS gradient-nya
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Render Bintang Berkelap-kelip
            stars.forEach(s => {
                s.alpha += s.fadeSpeed;
                if (s.alpha >= 1 || s.alpha <= 0.1) s.fadeSpeed *= -1; // Balik arah fade

                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
                ctx.fill();
            });

            const scaleFactor = (Math.min(canvas.width, canvas.height) / 45); 
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            // 2. Render Teks Hati (Mulus)
            ctx.font = `bold 14px "Arial Black", Arial, sans-serif`;
            particles.forEach(p => {
                p.t += p.speed; 
                if (p.t > Math.PI * 2) p.t -= Math.PI * 2;

                const pos = heartPosition(p.t);
                const x = (pos.x * scaleFactor * p.trackScale) + centerX;
                const y = (pos.y * scaleFactor * p.trackScale) + centerY;

                ctx.fillStyle = '#ff1a1a';
                ctx.fillText(textToDisplay, x, y);
            });

            // 3. Render Teks Di Tengah Hati (Efek Detak Jantung)
            // Rumus detak: menggunakan Math.sin dari waktu sekarang
            const beat = 1 + Math.sin(Date.now() * 0.003) * 0.1; 
            ctx.save();
            ctx.translate(centerX, centerY - 10); // Agak ke atas dikit
            ctx.scale(beat, beat);
            ctx.font = `bold ${scaleFactor * 1.5}px "Arial Black", Arial, sans-serif`;
            
            // Efek glow untuk teks tengah
            ctx.shadowBlur = 15;
            ctx.shadowColor = "rgba(255, 0, 50, 0.8)";
            ctx.fillStyle = "#ffffff"; // Warna teks putih
            ctx.fillText(centerText, 0, 0);
            ctx.restore();

            // 4. Render Mawar Jatuh
            roses.forEach(r => {
                r.y += r.speedY; 
                r.x += r.speedX + Math.sin(r.y * 0.02) * 0.5; 
                r.angle += r.spin; 

                if (r.y > canvas.height + 30) {
                    r.y = -30;
                    r.x = Math.random() * canvas.width;
                }

                ctx.save();
                ctx.translate(r.x, r.y);
                ctx.rotate(r.angle);
                ctx.font = `${r.size}px Arial`;
                ctx.fillText('🌹', 0, 0);
                ctx.restore();
            });

            requestAnimationFrame(animate);
        }

        // Tombol Interaksi (Mulai Musik)
        startBtn.addEventListener('click', () => {
            startBtn.style.display = 'none'; // Sembunyikan tombol
            // Putar musik jika file ada
            bgMusic.play().catch(e => console.log("Lagu tidak ditemukan, lupakan audio.")); 
        });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
            initHeart();
            initRoses();
        });

        initStars();
        initHeart();
        initRoses();
        animate();
    </script>
</body>
</html>
